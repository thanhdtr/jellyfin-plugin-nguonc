<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>NguonC Plugin Configuration</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .config-container { max-width: 600px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .description { color: #666; font-size: 0.9em; margin-top: 3px; }
        .test-btn { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .test-btn:hover { background: #0056b3; }
        #test-result { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="config-container">
        <h2>🎬 NguonC - Phim HD Configuration</h2>
        
        <div class="form-group">
            <label for="ApiBaseUrl">API Base URL</label>
            <input type="text" id="ApiBaseUrl" value="https://phim.nguonc.com/api">
            <div class="description">Base URL for the NguonC API. Default: https://phim.nguonc.com/api</div>
        </div>

        <div class="form-group">
            <label for="ItemsPerPage">Items Per Page</label>
            <input type="number" id="ItemsPerPage" value="24" min="6" max="48">
            <div class="description">Number of items to display per page (6-48)</div>
        </div>

        <div class="form-group">
            <label for="PreferredLanguage">Preferred Language</label>
            <select id="PreferredLanguage">
                <option value="all">All (Show all servers)</option>
                <option value="vietsub">Vietsub (Subtitle)</option>
                <option value="thuyetminh">Thuyết Minh (Dubbed)</option>
                <option value="longtieng">Lồng Tiếng (Voice-over)</option>
            </select>
            <div class="description">Preferred language/subtitle option for video playback</div>
        </div>

        <button class="test-btn" onclick="testApiConnection()">Test API Connection</button>
        <div id="test-result"></div>
    </div>

    <script>
        function testApiConnection() {
            const baseUrl = document.getElementById('ApiBaseUrl').value;
            const resultDiv = document.getElementById('test-result');
            resultDiv.style.display = 'block';
            resultDiv.className = '';
            resultDiv.textContent = 'Testing connection...';

            fetch(`${baseUrl}/films/phim-moi-cap-nhat?page=1`)
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    }
                    throw new Error(`HTTP ${response.status}`);
                })
                .then(data => {
                    resultDiv.className = 'success';
                    resultDiv.textContent = `✅ Connection successful! Found ${data.paginate?.total_items || '?'} films. API is working correctly.`;
                })
                .catch(error => {
                    resultDiv.className = 'error';
                    resultDiv.textContent = `❌ Connection failed: ${error.message}. Please check the API URL and try again.`;
                });
        }
    </script>
</body>
</html>
